  lat: 34.0094      # approx. centroid of ZIP 90008 (Baldwin Hills / Crenshaw)
  lng: -118.3463
  visit_radius_miles: 50          # straight-line pre-filter; real drive time decides
  visit_max_drive_minutes: 75

