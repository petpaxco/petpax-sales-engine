[project]
name = "petpax-sales-engine"
version = "0.1.0"
description = "AI sales development engine for PetPax Co. grooming salon partners"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "requests>=2.31",
  "rapidfuzz>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
